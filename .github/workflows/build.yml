# Builds a debug APK on every push / PR so you can grab it from the Actions tab.
# (Releases for the in-app updater are built by release.yml.)
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        working-directory: MentzerTracker
        run: |
          chmod +x ./gradlew
          ./gradlew testGithubDebugUnitTest --no-daemon

      # Both editions must compile: GitHub (self-updating) and Play (billing, no updater).
      - name: Build debug APKs
        working-directory: MentzerTracker
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGithubDebug assemblePlayDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rarelift-debug
          path: MentzerTracker/app/build/outputs/apk/*/debug/*.apk