# Push a tag like v1.1.0  ->  builds a SIGNED release APK and publishes a GitHub
# Release with it attached. The app's updater finds it automatically.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Set up signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Updates REQUIRE a fixed signing key - see README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: MentzerTracker
        run: |
          chmod +x ./gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease --no-daemon -PappVersionName="$VERSION"

      - name: Copy APK to workspace root with versioned name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp MentzerTracker/app/build/outputs/apk/release/app-release.apk "MentzerTracker-$VERSION.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MentzerTracker-*.apk
          generate_release_notes: true
